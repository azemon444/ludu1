services:
  - type: web
    name: ludo1
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: PUBLIC_BASE_URL
        value: https://ludu1.onrender.com
      - key: ZINIPAY_API_KEY
        sync: false
      - key: ZINIPAY_WEBHOOK_SECRET
        sync: false

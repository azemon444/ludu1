<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#070b16" />
  <title>Ludo — 2 to 4 players online</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="connBar" class="conn-bar hidden">Connection lost — reconnecting…</div>

  <div class="app">
    <section id="homeScreen" class="screen home">
      <header class="brand">
        <div class="logo">🎲</div>
        <h1>Ludo</h1>
        <p class="tagline">2–4 players · play online</p>
      </header>

      <div class="card">
        <div class="field">
          <label for="nameInput">Your name</label>
          <input id="nameInput" maxlength="16" autocomplete="off" placeholder="Enter your name" />
        </div>

        <div class="field">
          <label>Players</label>
          <div id="homeSizePicker" class="size-picker" role="group" aria-label="Number of players">
            <button type="button" class="size-opt" data-size="2">2<span>1v1</span></button>
            <button type="button" class="size-opt" data-size="3">3<span>solo</span></button>
            <button type="button" class="size-opt" data-size="4">4<span>2v2</span></button>
          </div>
        </div>

        <button id="quickBtn" class="btn primary">Quick match <span class="btn-sub" id="quickSub">2v2</span></button>
        <button id="createBtn" class="btn">Create a private room</button>

        <div class="divider"><span>or join with a code</span></div>

        <div class="join-row">
          <input id="codeInput" maxlength="4" inputmode="text" autocomplete="off" placeholder="CODE" aria-label="Room code" />
          <button id="joinBtn" class="btn">Join</button>
        </div>
      </div>

      <p class="hint">
        <b class="t-red">Red</b> + <b class="t-yellow">Yellow</b>
        <span class="vs">vs</span>
        <b class="t-green">Green</b> + <b class="t-blue">Blue</b>
        <span class="hint-note">in 4-player games</span>
      </p>
      <p class="hint tiny">Roll a 6 to leave the yard · first to bring all 4 pawns home wins</p>
    </section>

    <section id="waitScreen" class="screen hidden">
      <div class="card wide">
        <div class="row-between">
          <div>
            <div class="muted small-label">Room code</div>
            <div id="roomCode" class="code">----</div>
          </div>
          <div class="head-actions">
            <button id="copyBtn" class="btn ghost small">Copy</button>
            <button id="leaveWaitBtn" class="btn ghost small">Leave</button>
          </div>
        </div>

        <div class="field">
          <label>Game size <span id="sizeHint" class="label-note">host can change</span></label>
          <div id="waitSizePicker" class="size-picker" role="group" aria-label="Game size">
            <button type="button" class="size-opt" data-size="2">2<span>1v1</span></button>
            <button type="button" class="size-opt" data-size="3">3<span>solo</span></button>
            <button type="button" class="size-opt" data-size="4">4<span>2v2</span></button>
          </div>
        </div>

        <div id="seatList" class="seats"></div>

        <div class="actions">
          <button id="fillBotsBtn" class="btn ghost">Fill with bots</button>
          <button id="startBtn" class="btn primary" disabled>Start game</button>
        </div>
        <div id="waitMsg" class="muted center"></div>
      </div>
    </section>

    <section id="gameScreen" class="screen game hidden">
      <div class="game-head">
        <div class="head-actions">
          <div class="pill" id="roomPill">----</div>
          <button id="leaveGameBtn" class="btn ghost small">Leave</button>
        </div>
        <div class="team-bar" id="teamBar"></div>
      </div>

      <div class="board-wrap">
        <canvas id="board" width="720" height="720"></canvas>
        <div id="moveHint" class="move-hint hidden">Tap a glowing token</div>
        <div id="banner" class="banner hidden">
          <div id="bannerTitle" class="banner-title"></div>
          <div id="bannerText" class="banner-text"></div>
          <button id="restartBtn" class="btn primary hidden">Play again</button>
        </div>
      </div>

      <div class="controls">
        <div class="turn-info" id="turnInfo">Waiting…</div>
        <button id="diceBtn" class="dice" disabled aria-label="Roll dice">
          <span id="diceVal"><span class="dice-idle">🎲</span></span>
        </button>
        <div class="log" id="log"></div>
      </div>
    </section>
  </div>

  <div id="queueOverlay" class="queue-overlay hidden">
    <div class="queue-card">
      <div class="spinner"></div>
      <h2>Finding players…</h2>
      <p id="queueCount" class="muted">1 / 4 players</p>
      <button id="soloBtn" class="btn primary">Play vs bots instead</button>
      <button id="cancelQueueBtn" class="btn ghost">Cancel</button>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
